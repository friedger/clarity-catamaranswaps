name: CI Clarinet

# Controls when the action will run.
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3
      - name: "clarinet check"
        uses: docker://hirosystems/clarinet:2.14.0
        with:
          entrypoint: "bash"
          args: -c "cd catamaran-sbtc && CLARINET_DISABLE_HINTS=1 clarinet check"
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: "pnpm"
      - name: "pnpm test"
        working-directory: ./catamaran-sbtc
        run: |
          pnpm install
          pnpm test
