name: CI Clarinet

# Controls when the action will run.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3
      - name: "clarinet check"
        uses: docker://hirosystems/clarinet:2.14.0
        with:
          entrypoint: "bash"
          args: -c "cd catamaran-sbtc && CLARINET_DISABLE_HINTS=1 clarinet check"
      - name: "pnpm test"
        run: |
          cd catamaran-sbtc
          pnpm test
